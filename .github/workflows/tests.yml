name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Image des bots pour les tests
        run: docker pull python:3.12-slim
      # En root : le panel donne les fichiers des bots à l'utilisateur 1000, comme dans Docker
      - name: Tests
        run: sudo -E env "PATH=$PATH" BOTPANEL_TEST_IMAGE=python:3.12-slim python -m pytest -q
      - name: L'image du panel se construit
        run: docker build -t botpanel:test .
